<aside
  aria-label="Habits"
  class="flex flex-col bg-panel px-6 py-5 text-panel-ink lg:min-h-dvh lg:justify-between lg:gap-10 lg:px-14 lg:py-12"
>
  <a
    href="/"
    class="flex items-center gap-3 self-start text-lg font-semibold text-white [--logo-tile:var(--color-panel-tile)]"
  >
    <load src="/components/logo.html" />
    Habits
  </a>

  <!-- heatArt (src/components/heat-art.js) lights the days in waves. -->

    x-data="heatArt"
    class="mx-auto my-auto hidden w-full max-w-96 grid-cols-7 gap-2.5 lg:grid"

      <div class="heat-art-cell h-11 rounded-[10px]"></div>
    </template>

  <p class="hidden max-w-xs text-panel-muted lg:block">
