<!doctype html>
<html lang="en">
  <head>
    <load src="/components/head.html" />
    <title>Statistics · Habits</title>
    <!-- blocking="render": the browser keeps showing the previous page until
         this page is fully built, so nothing appears half-drawn. -->
    <script type="module" src="/src/stats.js" blocking="render"></script>
  </head>
  <body class="min-h-dvh">
    <load src="/components/nav.html" active="stats" />

    <main class="page gap-6" x-data="statsComponent">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="page-title">Statistics</h1>
          <p class="page-subtitle" x-text="stats?.title ?? ''"></p>
        </div>
        <div
          role="group"
          aria-label="Period"
          class="segmented w-full sm:w-auto sm:min-w-[420px]"
        >
          <button
            type="button"
            class="segment"
            @click="pick('week')"
            aria-pressed="true"
            :aria-pressed="(period === 'week').toString()"
          >
            Week
          </button>
          <button
            type="button"
            class="segment"
            @click="pick('month')"
            aria-pressed="false"
            :aria-pressed="(period === 'month').toString()"
          >
            Month
          </button>
          <button
            type="button"
            class="segment"
            @click="pick('year')"
            aria-pressed="false"
            :aria-pressed="(period === 'year').toString()"
          >
            Year
          </button>
          <button
            type="button"
            class="segment"
            @click="pick('all')"
            aria-pressed="false"
            :aria-pressed="(period === 'all').toString()"
          >
            All time
          </button>
        </div>
      </div>

      <div
        x-show="error"
        x-cloak
        class="alert alert-error"
        role="alert"
        x-text="error"
      ></div>

      <section
        x-show="!loading && !hasHabits"
        x-cloak
        class="card flex flex-col items-start gap-4 p-6 sm:p-8"
      >
        <div>
          <h2 class="text-xl font-bold">No statistics yet</h2>
          <p class="mt-1 text-muted">
            Add a habit and check it off for a few days to see how it's going.
          </p>
        </div>
        <a href="/habits/?new=1" class="btn btn-primary">
          <load src="/components/plus-icon.html" />
          Add habit
        </a>
      </section>

      <template x-if="!loading && hasHabits && stats">
        <div class="flex flex-col gap-6">
          <div class="grid grid-cols-2 gap-4 md:grid-cols-3">
            <section
              aria-label="Success rate"
              class="card flex flex-col gap-1 p-5"
            >
              <span class="stat-label">Success rate</span>
              <span
                class="stat-value text-primary"
                x-text="stats.pctText"
              ></span>
            </section>
            <section aria-label="Done" class="card flex flex-col gap-1 p-5">
              <span class="stat-label">Done</span>
              <span class="stat-value" x-text="stats.countText"></span>
            </section>
            <section
              aria-label="Best streak"
              class="card col-span-2 flex flex-col gap-1 p-5 md:col-span-1"
            >
              <span class="stat-label">Best streak</span>
              <span class="stat-value" x-text="stats.bestText"></span>
              <span class="text-sm text-muted" x-text="stats.bestHabit"></span>
            </section>
          </div>

          <!-- Side by side on large screens, where the list of habits scrolls
               inside its card instead of making the row taller. -->
          <div
            class="flex flex-wrap items-start gap-6 lg:grid lg:grid-cols-[3fr_2fr] lg:items-stretch"
          >
            <section
              aria-label="Completion chart"
              class="card flex min-w-0 flex-[3_1_520px] flex-col gap-4 p-5"
            >
              <div>
                <h2 class="card-title" x-text="stats.chartTitle"></h2>
                <span class="text-sm text-muted"
                  >Share of habits done, in percent.</span
                >
              </div>
              <div class="flex items-end gap-1.5 sm:gap-2">
                <template x-for="bar in stats.bars" :key="bar.label">
                  <div class="flex min-w-0 flex-1 flex-col items-center gap-2">
                    <div
                      class="flex h-[190px] w-full flex-col items-center justify-end gap-1.5"
                    >
                      <span
                        class="text-[13px] font-semibold text-muted"
                        x-text="bar.text"
                      ></span>
                      <div
                        class="w-full max-w-12 rounded-t-lg rounded-b-sm"
                        :class="bar.current ? 'bg-primary' : 'bg-bar'"
                        :style="{ height: bar.height }"
                      ></div>
                    </div>
                    <span
                      class="max-w-full truncate text-xs text-muted sm:text-[13px]"
                      x-text="bar.label"
                    ></span>
                  </div>
                </template>
              </div>
            </section>

            <section
              aria-label="By habit"
              class="card flex min-w-0 flex-[2_1_340px] flex-col overflow-hidden"
            >
              <div class="px-5 pt-5 pb-2">
                <h2 class="card-title">By habit</h2>
                <span class="text-sm text-muted"
                  >Open a habit for its details.</span
                >
              </div>
              <div class="relative lg:min-h-[240px] lg:flex-1">
                <div
                  class="lg:absolute lg:inset-0 lg:overflow-y-auto lg:overscroll-contain"
                >
                  <template x-for="(h, i) in stats.habits" :key="h.id">
                    <a
                      :href="`/habits/?id=${h.id}`"
                      class="flex min-h-[60px] flex-col justify-center gap-2 border-t border-divider px-5 py-3 transition-colors hover:bg-canvas/50"
                      :class="!showAllHabits && i >= HABITS_SHOWN && 'max-lg:hidden'"
                    >
                      <span
                        class="flex items-baseline justify-between gap-3 text-base font-semibold"
                      >
                        <span class="flex min-w-0 items-center gap-2">
                          <span
                            class="size-2.5 shrink-0 rounded-full"
                            :style="{ background: h.color }"
                          ></span>
                          <span class="truncate" x-text="h.name"></span>
                        </span>
                        <span x-text="h.pctText"></span>
                      </span>
                      <span class="progress h-2">
                        <span :style="{ width: h.width }"></span>
                      </span>
                    </a>
                  </template>
                </div>
              </div>
              <button
                type="button"
                x-show="!showAllHabits && stats.habits.length > HABITS_SHOWN"
                class="btn btn-quiet btn-sm m-2 lg:hidden"
                @click="showAllHabits = true"
                x-text="`Show all ${stats.habits.length}`"
              ></button>
              <p x-show="!stats.habits.length" class="px-5 pb-5 text-muted">
                Nothing was due in this period.
              </p>
            </section>
          </div>

          <section
            aria-label="Consistency calendar"
            class="card flex flex-col gap-3.5 p-5"
          >
            <div class="flex flex-wrap items-end justify-between gap-3">
              <div>
                <h2 class="card-title">Consistency</h2>
                <span class="text-sm text-muted">
                  <span class="hidden sm:inline">The last 52 weeks.</span>
                  <span class="sm:hidden">The last 18 weeks.</span>
                  Pick a day to open it.
                </span>
              </div>
              <div
                class="flex items-center gap-1.5 text-[13px] text-muted"
                aria-hidden="true"
              >
                <span>less</span>
                <span class="heat-0 size-4 rounded"></span>
                <span class="heat-1 size-4 rounded"></span>
                <span class="heat-2 size-4 rounded"></span>
                <span class="heat-3 size-4 rounded"></span>
                <span class="heat-4 size-4 rounded"></span>
                <span>more</span>
              </div>
            </div>

            <div class="hidden flex-col gap-1.5 sm:flex">
              <div
                class="grid grid-cols-[28px_minmax(0,1fr)] gap-x-2 gap-y-1.5"
              >
                <span></span>
                <div
                  class="grid h-4 grid-cols-[repeat(52,minmax(0,1fr))] gap-[3px] text-xs leading-4 text-muted"
                  aria-hidden="true"
                >
                  <template x-for="(m, i) in heatWide.months" :key="i">
                    <span
                      class="overflow-visible whitespace-nowrap"
                      x-text="m"
                    ></span>
                  </template>
                </div>
                <div
                  class="grid grid-rows-7 gap-[3px] text-xs text-muted"
                  aria-hidden="true"
                >
                  <template x-for="(d, i) in heatWide.weekdays" :key="i">
                    <span class="h-4 leading-4" x-text="d"></span>
                  </template>
                </div>
                <div
                  role="img"
                  aria-label="Calendar of completed habits over the last 52 weeks"
                  class="grid grid-cols-[repeat(52,minmax(0,1fr))] gap-[3px]"
                >
                  <template x-for="cell in heatWide.cells" :key="cell.key">
                    <a
                      tabindex="-1"
                      class="block h-4 rounded"
                      :class="cell.future ? '' : 'heat-' + cell.level + ' hover:ring-2 hover:ring-primary'"
                      :href="cell.future ? null : `/?date=${cell.key}`"
                      :title="cell.title"
                    ></a>
                  </template>
                </div>
              </div>
            </div>

            <div class="flex flex-col gap-1.5 sm:hidden">
              <div
                class="grid grid-cols-[28px_minmax(0,1fr)] gap-x-2 gap-y-1.5"
              >
                <span></span>
                <div
                  class="grid h-4 grid-cols-[repeat(18,minmax(0,1fr))] gap-[3px] text-xs leading-4 text-muted"
                  aria-hidden="true"
                >
                  <template x-for="(m, i) in heatNarrow.months" :key="i">
                    <span
                      class="overflow-visible whitespace-nowrap"
                      x-text="m"
                    ></span>
                  </template>
                </div>
                <div
                  class="grid grid-rows-7 gap-[3px] text-xs text-muted"
                  aria-hidden="true"
                >
                  <template x-for="(d, i) in heatNarrow.weekdays" :key="i">
                    <span class="h-4 leading-4" x-text="d"></span>
                  </template>
                </div>
                <div
                  role="img"
                  aria-label="Calendar of completed habits over the last 18 weeks"
                  class="grid grid-cols-[repeat(18,minmax(0,1fr))] gap-[3px]"
                >
                  <template x-for="cell in heatNarrow.cells" :key="cell.key">
                    <a
                      tabindex="-1"
                      class="block h-4 rounded"
                      :class="cell.future ? '' : 'heat-' + cell.level + ' hover:ring-2 hover:ring-primary'"
                      :href="cell.future ? null : `/?date=${cell.key}`"
                      :title="cell.title"
                    ></a>
                  </template>
                </div>
              </div>
            </div>
          </section>

          <section
            aria-label="Insight"
            class="flex flex-col gap-1 rounded-2xl bg-panel px-6 py-5"
          >
            <span class="text-sm font-bold text-lamp">Insight</span>
            <span
              class="text-lg leading-snug text-panel-ink"
              x-text="stats.insight"
            ></span>
          </section>
        </div>
      </template>
    </main>
  </body>
</html>
